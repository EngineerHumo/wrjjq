env:
  grid_m: 40
  grid_n: 40
  obstacle_ratio: 0.05
  num_uavs: 3
  num_targets: 1
  dt: 1.0
  fov_radius: 5.0
  comm_range: 8.0
  safe_distance: 1.5
  warning_distance: 3.0
  min_speed: 0.2
  max_speed: 1.5
  max_accel: 0.5
  max_yaw_rate: 0.7
  obs_patch_size: 7
  max_neighbors: 3
  detect_prob: 0.8
  pf:
    num_particles: 500
    init_pos_sigma: 1.5
    speed_range: [0.2, 1.2]
    heading_range: [-3.14, 3.14]
    yaw_rate_range: [-0.4, 0.4]
    process_noise: 0.3
    meas_noise: 1.5
    neg_decay: 0.6
    sigmoid_k: 8.0
    soft_vmax: 1.5
    soft_yaw_rate_max: 0.7
reward:
  cover_weight: 1.0
  explore_weight: 1.0
  overlap_weight: 0.5
  share_weight: 0.2
  smooth_weight: 0.3
  obstacle_weight: 1.0
  collision_weight: 2.0
  entropy_weight: 0.3
  warning_weight: 0.5
  energy_weight: 0.1
train:
  seed: 42
  episodes: 200
  max_steps: 200
  batch_size: 256
  warmup_steps: 1000
  gamma: 0.95
  tau: 0.01
  actor_lr: 0.0005
  critic_lr: 0.001
  hidden_dim: 128
  buffer_size: 200000
  noise_type: ou
  noise_sigma: 0.2
  noise_theta: 0.15
  grad_clip: 1.0
  eval_interval: 20
  eval_episodes: 5
  save_interval: 50
  log_interval: 10
  plot_interval: 10
  reward_ma_windows: [50, 100]
  device: cpu
  entropy_coeff: 1.0
